name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# The deploy job runs on the box itself; nothing here needs more than read.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: DATABASE_URL=postgresql://placeholder npm ci

      - run: npm test

      - run: npm run lint

      - run: npm run build

  deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Build and restart the stack
        env:
          DEPLOY_DIR: /home/maahir/containers/website
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          git fetch --prune origin
          git reset --hard origin/main
          docker compose build --pull
          docker compose up -d --build --remove-orphans

      - name: Wait for the site to answer
        env:
          DEPLOY_DIR: /home/maahir/containers/website
        run: |
          set -euo pipefail
          for _ in $(seq 1 45); do
            if curl -fsS -o /dev/null http://localhost:3002/; then
              echo "site is up"
              exit 0
            fi
            sleep 2
          done
          echo "site did not come up; recent logs:"
          cd "$DEPLOY_DIR" && docker compose logs --tail 60
          exit 1

      - name: Drop dangling images
        if: always()
        run: docker image prune -f
