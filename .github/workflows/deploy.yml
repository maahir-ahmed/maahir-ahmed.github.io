name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: DATABASE_URL=postgresql://placeholder npm ci

      - run: npm test

      - run: npm run build

  deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Build and restart the stack
        env:
          DEPLOY_DIR: /home/maahir/containers/website
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          git fetch --prune origin
          git reset --hard origin/main
          docker compose up -d --build --remove-orphans

      - name: Wait for the site to answer
        env:
          DEPLOY_DIR: /home/maahir/containers/website
        run: |
          set -euo pipefail
          for _ in $(seq 1 45); do
            if curl -fsS -o /dev/null http://localhost:3002/; then
              echo "site is up"
              exit 0
            fi
            sleep 2
          done
          echo "site did not come up; recent logs:"
          cd "$DEPLOY_DIR" && docker compose logs --tail 60
          exit 1

      - name: Drop dangling images
        if: always()
        run: docker image prune -f
